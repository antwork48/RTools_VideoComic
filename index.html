<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTools Video Editting</title>
<meta name="description" content="Web tools for video editing: RTools Comic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='800' font-size='20' fill='%23fff'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="nav.js"></script>
<style>
:root{--bg:#0e0b14;--panel:#171222;--line:#2a2238;--text:#ece8f5;--mut:#9a90b0;--acc:#8b5cf6;--acc2:#c4b5fd;--hot:#fb923c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 16px/1.5 Manrope,system-ui,sans-serif;position:relative;overflow-x:hidden}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:360px;background:radial-gradient(circle,rgba(139,92,246,.45) 1.6px,transparent 2.2px) 0 0/18px 18px;-webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 55%);mask-image:linear-gradient(200deg,#000 0%,transparent 55%);pointer-events:none}
main{position:relative;max-width:1080px;margin:0 auto;padding:56px 20px 40px}
h1{margin:0;font:800 clamp(34px,8vw,52px)/1.05 Manrope,sans-serif;letter-spacing:-.02em}
.sub{margin:14px 0 40px;color:var(--mut);max-width:46ch}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
a.tool{display:flex;flex-direction:column;gap:14px;height:100%;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.tool:hover{border-color:var(--hot);transform:translateY(-4px)}
a.tool>span:nth-child(2){flex:1}
a.tool:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.ico{width:56px;height:56px;display:grid;place-items:center;border-radius:12px;background:#221a33;color:var(--acc2)}
.ico svg{width:34px;height:34px}
h2{margin:0 0 2px;font:800 19px/1.2 Manrope,sans-serif}
p{margin:0;color:var(--mut);font-size:14px}
.tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--hot)}
.go{color:var(--hot);width:24px;height:24px;align-self:flex-end}
footer{margin-top:48px;color:var(--mut);font-size:13px}
@media(max-width:900px){ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){main{padding-top:36px}ul{grid-template-columns:1fr;gap:12px}a.tool{flex-direction:row;align-items:center;padding:14px}.ico{width:48px;height:48px;flex:none}.go{display:none}}
@media(prefers-reduced-motion:reduce){a.tool{transition:none}a.tool:hover{transform:none}}
</style>
</head>
<body>
<main>
  <h1>RTools Comic</h1>
  <p class="sub">Web tools for video editing. They run right in your browser, no install needed.</p>
  <ul id="list"></ul>
  <footer>RTools Comic</footer>
</main>
<script>
document.getElementById('list').innerHTML=RTOOLS.tools.map(t=>`<li><a class="tool" href="${t.dir}/${RTOOLS.X}"><span class="ico" aria-hidden="true">${t.icon}</span><span><h2>${t.name}</h2><p>${t.desc}</p><span class="tag">${t.tag}</span></span><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>`).join('');
</script>
</body>
</html>
