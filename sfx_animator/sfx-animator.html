<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFX Animator – by rorin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Dela+Gothic+One&family=Manrope:wght@400;600;800&family=Potta+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b14;--panel:#171222;--line:#2a2238;--text:#ece8f5;--mut:#9a90b0;--acc:#8b5cf6;--acc2:#c4b5fd;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 Manrope,system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{display:flex;align-items:baseline;gap:12px;padding:16px 16px 8px;max-width:1200px;margin:0 auto}
h1{margin:0;font:800 22px/1 Manrope,sans-serif;letter-spacing:-.01em}
.by{color:var(--acc2);font-weight:600;font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;padding:8px 16px 32px;max-width:1200px;margin:0 auto;align-items:start}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:4px}
canvas{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:conic-gradient(#1b1526 25%,#241c33 0 50%,#1b1526 0 75%,#241c33 0) 0 0/20px 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
button{font:600 14px Manrope,sans-serif;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.go{background:var(--acc);border-color:var(--acc);color:#fff}
button.go:hover{background:#7c3aed}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
#msg{color:var(--mut);font-size:13px;min-height:1.4em;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px 10px}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pre button{padding:6px 11px;font-size:13px}
details{border-top:1px solid var(--line);padding:4px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:800;padding:8px 0;color:var(--acc2)}
label{display:grid;grid-template-columns:1fr minmax(0,1.3fr) 40px;gap:8px;align-items:center;padding:4px 0;font-size:13px;color:var(--mut)}
label>*:nth-child(2){grid-column:2}
output{text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-size:12px}
input[type=text],select{width:100%;grid-column:2/4;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:100%;height:30px;background:none;border:1px solid var(--line);border-radius:6px;padding:2px;grid-column:2/4}
input[type=file]{grid-column:2/4;font-size:12px;color:var(--mut);max-width:100%}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
@media(max-width:820px){main{grid-template-columns:1fr}canvas{max-height:34vh}}
</style>
</head>
<body>
<header><h1>SFX Animator</h1><span class="by">by rorin</span></header>
<main>
<section class="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="pp">Pause</button>
    <button id="bw" class="go" disabled>Export WebM</button>
    <button id="bp" class="go" disabled>Export PNG sequence (.zip)</button>
    <button id="bg" class="go" disabled>Export GIF</button>
  </div>
  <div id="msg"></div>
</section>
<section class="panel">
  <div class="pre" id="pre"></div>
  <div id="ui"></div><datalist id="fl"></datalist>
  <p class="note">Exports are always transparent. WebM alpha depends on the browser; for guaranteed alpha that works in Premiere, use the PNG sequence. GIF only supports 256 colors and on/off transparency, so edges are rougher.</p>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),fc=document.createElement('canvas'),fx=fc.getContext('2d');
const FONTS=['Dela Gothic One','Potta One','Rubik Mono One','Anton','Bangers'];
const ANIMS=['none','fade','pop','slam','drop','slide','rise','spin','stretch','scatter'];
const P={text:'ゴゴゴゴ',font:'Dela Gothic One',size:200,spacing:0,curve:'none',amt:40,freq:1.2,speed:.5,skew:-.2,rot:-3,
 c1:'#f5f3ff',c2:'#8b5cf6',s1c:'#1e0b3d',s1w:12,s2c:'#a78bfa',s2w:8,texa:.6,
 ain:'slam',aout:'fade',pop:1,popd:.35,outd:.4,stag:.04,wig:5,wrate:12,shake:6,dur:2.5,fps:30,res:'1280x720',gw:480,gfps:20};
const DEF={...P};
const PRE={
 'Menacing':{},
 'Flag':{text:'ババーン',curve:'flag',amt:45,freq:1.3,speed:.6,wig:0,shake:0,skew:0,rot:0,c1:'#fdf4ff',c2:'#c084fc',ain:'slide',aout:'slide'},
 'Fish':{text:'ドォォン',curve:'fish',amt:90,wig:2,shake:3,skew:0,rot:0,c1:'#ede9fe',c2:'#7c3aed',ain:'pop',aout:'pop'},
 'Arc':{text:'ズキュゥゥン',curve:'arc',amt:70,size:170,wig:3,shake:0,skew:-.1,rot:0,c1:'#ffffff',c2:'#a78bfa',ain:'drop',aout:'scatter'},
 'Shake':{text:'WRYYYY',font:'Anton',size:260,curve:'none',shake:16,wig:2,skew:-.15,rot:-2,c1:'#ffffff',c2:'#6d28d9',s1w:10,ain:'stretch',aout:'fade'}
};
const S=[
['Text',[['text','Text','t'],['font','Font (type an installed font name)','x']]],
['Shape',[['size','Size',20,500,1],['spacing','Letter spacing',-60,120,1],['curve','Curve','s',['none','flag','arc','fish']],['amt','Curve strength',0,200,1],['freq','Wave count',.2,4,.1],['speed','Wave speed',-3,3,.1],['skew','Skew',-.6,.6,.01],['rot','Rotation',-45,45,1]]],
['Color',[['c1','Gradient top','c'],['c2','Gradient bottom','c'],['s1c','Inner stroke','c'],['s1w','Inner stroke width',0,60,1],['s2c','Outer stroke','c'],['s2w','Outer stroke width',0,60,1],['tex','Texture (optional)','f'],['texa','Texture opacity',0,1,.05]]],
['Motion',[['ain','Animation in','s',ANIMS],['aout','Animation out','s',ANIMS],['pop','Animation strength',0,1.5,.05],['popd','In duration (s)',.1,1.5,.05],['outd','Out duration (s)',.1,1.5,.05],['stag','Letter delay (s)',0,.2,.01],['wig','Wiggle',0,30,1],['wrate','Wiggle speed (fps)',2,30,1],['shake','Shake',0,40,1]]],
['Export',[['dur','Duration (s)',.5,10,.5],['fps','FPS','s',[24,30,60]],['res','Resolution','s',['1280x720','1920x1080','1080x1080','1080x1920']],['gw','GIF width (px)','s',[320,480,640,800,1000]],['gfps','GIF FPS','s',[12,15,20,25,30]]]]
];
let TEX=null;const ctl={};
function setRes(){const[w,h]=P.res.split('x').map(Number);cv.width=fc.width=w;cv.height=fc.height=h}
function build(){
 S.forEach(([g,items],gi)=>{
  const d=document.createElement('details');d.open=gi<3;d.innerHTML=`<summary>${g}</summary>`;
  items.forEach(([k,l,a,b,c])=>{
   const row=document.createElement('label');row.innerHTML=`<span>${l}</span>`;let el;
   if(a==='t'){el=document.createElement('input');el.type='text'}
   else if(a==='c'){el=document.createElement('input');el.type='color'}
   else if(a==='x'){el=document.createElement('input');el.type='text';el.setAttribute('list','fl')}
   else if(a==='s'){el=document.createElement('select');b.forEach(o=>el.add(new Option(o,o)))}
   else if(a==='f'){el=document.createElement('input');el.type='file';el.accept='image/*';
    el.onchange=()=>{const f=el.files[0];if(!f){TEX=null;return}const im=new Image();im.onload=()=>TEX=im;im.src=URL.createObjectURL(f)};
    row.append(el);d.append(row);return}
   else{el=document.createElement('input');el.type='range';el.min=a;el.max=b;el.step=c;const o=document.createElement('output');el.out=o}
   el.oninput=()=>{P[k]=typeof DEF[k]==='number'?+el.value:el.value;if(el.out)el.out.textContent=el.value;if(k==='res')setRes();if(k==='font'||k==='text')loadFonts()};
   ctl[k]=el;row.append(el);if(el.out)row.append(el.out);d.append(row)});
  if(gi===0){const b=document.createElement('button');b.textContent='Load fonts from this PC';b.onclick=loadLocal;const n=document.createElement('p');n.className='note';n.id='fnote';n.textContent='Type the font name exactly as installed on your PC, or load the list.';d.append(b,n)}
  $('#ui').append(d)});
 Object.keys(PRE).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{Object.assign(P,DEF,PRE[n]);sync()};$('#pre').append(b)});
 sync()}
function sync(){for(const k in ctl){ctl[k].value=P[k];if(ctl[k].out)ctl[k].out.textContent=P[k]}setRes();loadFonts()}
const loadFonts=()=>document.fonts.load(`60px "${P.font.replace(/"/g,'')}"`,P.text).catch(()=>{});
async function loadLocal(){const n=$('#fnote');if(!window.queryLocalFonts){n.textContent='This browser does not support listing PC fonts (desktop Chrome or Edge does). Type the font name manually.';return}try{const l=await queryLocalFonts(),fam=[...new Set(l.map(f=>f.family))].sort();$('#fl').replaceChildren(...[...FONTS,...fam].map(f=>new Option(f,f)));n.textContent=`${fam.length} fonts loaded. Click the font field to choose.`}catch(e){n.textContent='Font access was denied or blocked here. Type the font name manually.'}}

const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const eob=q=>{const c=2.2,x=q-1;return 1+(c+1)*x*x*x+c*x*x};
const clamp=q=>Math.max(0,Math.min(1,q)),eo=q=>1-(1-q)**3,vis=l=>l.sx*l.sy>1e-4&&l.a>.001,bnc=q=>{const n=7.5625,d=2.75;if(q<1/d)return n*q*q;if(q<2/d)return n*(q-=1.5/d)*q+.75;if(q<2.5/d)return n*(q-=2.25/d)*q+.9375;return n*(q-=2.625/d)*q+.984375};
function AW(st,k,i,I,d){const o={s:1,sx:1,sy:1,dx:0,dy:0,r:0,a:1},c=clamp(k),T=Math.PI*2;
 switch(st){case'fade':o.a=1-c;break;case'pop':o.s=Math.max(0,1-k*I);break;case'slam':o.s=1+k*2.5*I;o.a=clamp(1-k*1.2);break;case'drop':o.dy=d*k*700*I;break;case'slide':o.dx=d*k*700*I;o.a=clamp(3*(1-k));break;case'rise':o.dy=-d*k*220*I;o.a=1-c;break;case'spin':o.r=d*k*T*I;o.s=1-c;break;case'stretch':o.sx=1+k*2*I;o.sy=1-c;o.a=clamp(2*(1-k));break;case'scatter':o.dx=(rnd(i*3+1)-.5)*1400*k*I;o.dy=(rnd(i*3+2)-.5)*900*k*I;o.r=(rnd(i*3+3)-.5)*3*k*I;o.a=1-c}
 return o}
function render(t){
 const W=cv.width,H=cv.height,p=P;
 ctx.clearRect(0,0,W,H);fx.clearRect(0,0,W,H);
 const ch=[...p.text];if(!ch.length)return;
 const font=`${p.size}px "${p.font.replace(/"/g,'')}","Hiragino Sans","Noto Sans JP",sans-serif`;
 for(const g of[ctx,fx]){g.font=font;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.miterLimit=2}
 const w=ch.map(c=>ctx.measureText(c).width+p.spacing),tot=(w.reduce((a,b)=>a+b,0)-p.spacing)||1;
 const fr=Math.floor(t*p.fps+1e-6),gx=(rnd(fr*31+5)-.5)*2*p.shake,gy=(rnd(fr*17+9)-.5)*2*p.shake,ws=Math.floor(t*p.wrate);
 let x=-tot/2;const L=[];
 ch.forEach((c,i)=>{
  const xc=x+(w[i]-p.spacing)/2;x+=w[i];
  const u=(xc+tot/2)/tot,A=p.amt;let y=0,rot=0,sx=1,sy=1;
  if(p.curve==='flag'){const k=p.freq*2*Math.PI,ph=k*u-2*Math.PI*p.speed*t;y=A*Math.sin(ph);rot=Math.atan(A*k/tot*Math.cos(ph))}
  else if(p.curve==='arc'){y=-A*(1-(2*u-1)**2);rot=Math.atan(4*A*(2*u-1)/tot)}
  else if(p.curve==='fish'){const b=Math.sin(Math.PI*u);sy=1+A/100*b*1.5;sx=1+A/100*b*.4}
  const qi=clamp((t-i*p.stag)/p.popd),qo=clamp((t-(p.dur-p.outd-(ch.length-1)*p.stag)-i*p.stag)/p.outd);
  const ki=p.ain==='pop'?1-eob(qi):p.ain==='drop'?1-bnc(qi):1-eo(qi),ai=AW(p.ain,ki,i,p.pop,-1),ao=AW(p.aout,qo*qo,i,p.pop,1);
  const wx=(rnd(i*7+ws*13+1)-.5)*2*p.wig,wy=(rnd(i*11+ws*19+3)-.5)*2*p.wig,wr=(rnd(i*5+ws*23+7)-.5)*p.wig*.006;
  L.push({c,xc:xc+wx+ai.dx+ao.dx,y:y+wy+ai.dy+ao.dy,rot:rot+wr+ai.r+ao.r,sx:sx*ai.s*ai.sx*ao.s*ao.sx,sy:sy*ai.s*ai.sy*ao.s*ao.sy,a:ai.a*ao.a})});
 const tr=(g,l)=>{g.save();g.globalAlpha=l.a;g.translate(W/2+gx,H/2+gy);g.rotate(p.rot*Math.PI/180);g.translate(l.xc,l.y);g.rotate(l.rot);g.transform(1,0,p.skew,1,0,0);g.scale(l.sx,l.sy)};
 const stroke=(col,lw)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;L.forEach(l=>{if(!vis(l))return;tr(ctx,l);ctx.strokeText(l.c,0,0);ctx.restore()})};
 if(p.s2w>0)stroke(p.s2c,(p.s1w+p.s2w)*2);
 if(p.s1w>0)stroke(p.s1c,p.s1w*2);
 L.forEach(l=>{if(!vis(l))return;tr(fx,l);const g=fx.createLinearGradient(0,-p.size*.5,0,p.size*.5);g.addColorStop(0,p.c1);g.addColorStop(1,p.c2);fx.fillStyle=g;fx.fillText(l.c,0,0);fx.restore()});
 if(TEX&&p.texa>0){const k=Math.max(W/TEX.width,H/TEX.height);fx.save();fx.globalCompositeOperation='source-atop';fx.globalAlpha=p.texa;fx.drawImage(TEX,(W-TEX.width*k)/2,(H-TEX.height*k)/2,TEX.width*k,TEX.height*k);fx.restore()}
 ctx.drawImage(fc,0,0)}

let playing=true,t0=performance.now(),tp=0,busy=false;
function loop(now){if(!busy){if(playing)tp=((now-t0)/1000)%P.dur;render(tp)}requestAnimationFrame(loop)}
$('#pp').onclick=e=>{playing=!playing;if(playing)t0=performance.now()-tp*1000;e.target.textContent=playing?'Pause':'Play'};

const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=d=>{let c=-1;for(let i=0;i<d.length;i++)c=CT[(c^d[i])&255]^(c>>>8);return(~c)>>>0};
function zip(fs){const parts=[],cd=[],enc=new TextEncoder();let off=0;
 fs.forEach(f=>{const nm=enc.encode(f.n),c=crc(f.d),n=f.d.length,h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,n,true);h.setUint32(22,n,true);h.setUint16(26,nm.length,true);
  parts.push(h.buffer,nm,f.d);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint32(16,c,true);e.setUint32(20,n,true);e.setUint32(24,n,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
  cd.push(e.buffer,nm);off+=30+nm.length+n});
 const cs=cd.reduce((a,b)=>a+b.byteLength,0),en=new DataView(new ArrayBuffer(22));
 en.setUint32(0,0x06054b50,true);en.setUint16(8,fs.length,true);en.setUint16(10,fs.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);
 return new Blob([...parts,...cd,en.buffer],{type:'application/zip'})}

let DL=null;const msg=m=>$('#msg').textContent=m,btn=v=>['#bw','#bp','#bg'].forEach(s=>$(s).disabled=v);
async function run(fn){if(busy)return;busy=true;btn(true);
 try{await document.fonts.load(`${P.size}px "${P.font}"`,P.text);await fn();}
 catch(e){msg(e&&e.code==='declined'?'Cancelled.':'Export failed: '+(e.message||e.code||e))}
 busy=false;btn(false)}
$('#bp').onclick=()=>run(async()=>{
 const n=Math.round(P.dur*P.fps),fs=[];
 for(let f=0;f<n;f++){render(f/P.fps);const b=await new Promise(r=>cv.toBlob(r,'image/png'));
  fs.push({n:`frame_${String(f+1).padStart(4,'0')}.png`,d:new Uint8Array(await b.arrayBuffer())});msg(`Render ${f+1}/${n}`)}
 await DL.save({filename:'sfx-frames.zip',data:zip(fs)});msg('PNG sequence saved.')});
$('#bw').onclick=()=>run(async()=>{
 const n=Math.round(P.dur*P.fps),st=cv.captureStream(0),tk=st.getVideoTracks()[0];
 const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:12e6}),chunks=[];
 rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 const done=new Promise(r=>rec.onstop=r);rec.start();
 for(let f=0;f<n;f++){render(f/P.fps);tk.requestFrame();msg(`Render ${f+1}/${n}`);await new Promise(r=>setTimeout(r,1000/P.fps))}
 rec.stop();await done;
 await DL.save({filename:'sfx.webm',data:new Blob(chunks,{type:'video/webm'})});msg('WebM saved.')});

function quant(h){
 const cols=[];for(let c=0;c<32768;c++)if(h[c])cols.push(c);
 const ch=(c,k)=>k?k===1?(c>>5)&31:c&31:c>>10;let bx=[cols];
 while(bx.length<255){let bi=-1,bs=0,bk=0;
  bx.forEach((b,i)=>{if(b.length<2)return;let be=-1,kk=0,cnt=0;for(let k=0;k<3;k++){let mn=31,mx=0;for(const c of b){const v=ch(c,k);if(v<mn)mn=v;if(v>mx)mx=v}if(mx-mn>be){be=mx-mn;kk=k}}
   for(const c of b)cnt+=h[c];const s=cnt*(be+1);if(s>bs){bs=s;bi=i;bk=kk}});
  if(bi<0)break;
  const b=bx[bi].sort((x,y)=>ch(x,bk)-ch(y,bk));let tot=0;for(const c of b)tot+=h[c];let a=0,m=0;for(;m<b.length-2;m++){a+=h[b[m]];if(a>=tot/2)break}
  bx.splice(bi,1,b.slice(0,m+1),b.slice(m+1))}
 const pal=new Array(768).fill(0),map=new Uint8Array(32768);
 bx.forEach((b,i)=>{let r=0,g=0,bl=0,t=0;for(const c of b){const n=h[c];r+=(c>>10)*n;g+=((c>>5)&31)*n;bl+=(c&31)*n;t+=n;map[c]=i+1}
  if(t){const e=v=>Math.min(255,Math.round(v/t*8+4));pal[(i+1)*3]=e(r);pal[(i+1)*3+1]=e(g);pal[(i+1)*3+2]=e(bl)}});
 return{pal,map}}
function lzw(px){const cl=256,eoi=257;let sz=9,nx=258,cur=0,bits=0;const dict=new Map(),out=[];
 const put=c=>{cur|=c<<bits;bits+=sz;while(bits>=8){out.push(cur&255);cur>>>=8;bits-=8}};
 put(cl);let pre=px[0];
 for(let i=1;i<px.length;i++){const k=px[i],key=pre*256+k,v=dict.get(key);
  if(v!==undefined)pre=v;else{put(pre);if(nx<4096){dict.set(key,nx++);if(nx>(1<<sz)&&sz<12)sz++}else{put(cl);dict.clear();sz=9;nx=258}pre=k}}
 put(pre);put(eoi);if(bits>0)out.push(cur&255);
 const r=[];for(let i=0;i<out.length;i+=255){const c=out.slice(i,i+255);r.push(new Uint8Array([c.length,...c]))}return r}
$('#bg').onclick=()=>run(async()=>{
 const n=Math.round(P.dur*P.gfps),w=P.gw,h=Math.round(cv.height*w/cv.width),g=document.createElement('canvas');g.width=w;g.height=h;
 const gx=g.getContext('2d',{willReadFrequently:true});gx.imageSmoothingQuality='high';
 const frs=[],hist=new Uint32Array(32768);
 for(let f=0;f<n;f++){render(f/P.gfps);gx.clearRect(0,0,w,h);gx.drawImage(cv,0,0,w,h);const d=gx.getImageData(0,0,w,h).data;
  for(let i=0;i<d.length;i+=4)if(d[i+3]>=128)hist[(d[i]>>3)<<10|(d[i+1]>>3)<<5|d[i+2]>>3]++;
  frs.push(d);msg(`Render ${f+1}/${n}`);if(f%4===3)await new Promise(r=>setTimeout(r))}
 msg('Building palette...');await new Promise(r=>setTimeout(r));
 const{pal,map}=quant(hist),B=[],u16=v=>[v&255,v>>8],dl=Math.max(2,Math.round(100/P.gfps));
 B.push(new Uint8Array([71,73,70,56,57,97,...u16(w),...u16(h),0xF7,0,0,...pal,33,255,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0]));
 for(let f=0;f<n;f++){const d=frs[f],ix=new Uint8Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++)ix[j]=d[i+3]<128?0:map[(d[i]>>3)<<10|(d[i+1]>>3)<<5|d[i+2]>>3];
  B.push(new Uint8Array([33,249,4,9,...u16(dl),0,0,44,0,0,0,0,...u16(w),...u16(h),0,8]),...lzw(ix),new Uint8Array([0]));
  msg(`Encode ${f+1}/${n}`);if(f%4===3)await new Promise(r=>setTimeout(r))}
 B.push(new Uint8Array([59]));
 await DL.save({filename:'sfx.gif',data:new Blob(B,{type:'image/gif'})});msg('GIF saved.')});

build();$('#fl').replaceChildren(...FONTS.map(f=>new Option(f,f)));requestAnimationFrame(loop);
const FB={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:'saved'}}};
const useFB=()=>{DL=FB;btn(false)};
if(window.claude&&claude.use){claude.use('downloads').then(d=>{if(d){DL=d;btn(false)}else useFB()}).catch(useFB)}
else useFB();
